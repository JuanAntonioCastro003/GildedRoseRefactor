plugins {
    id 'java'
    id 'jacoco' // El plugin de cobertura
    id "org.sonarqube" version "7.2.2.6593" // El plugin de Sonar
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.6.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.6.2'
}

group = 'com.gildedrose'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // Ejecuta jacoco después de los tests
}


task texttest(type: JavaExec) {
    main = "com.gildedrose.TexttestFixture"
    classpath = sourceSets.test.runtimeClasspath
    args "30"
}

jacocoTestReport {
    dependsOn test // El reporte se crea después de correr los tests
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}

sonar {
    properties {
        property "sonar.projectKey", "kata-rose"
        property "sonar.host.url", "http://localhost:9000" // O tu server local
        property "sonar.token", project.findProperty("sonarToken")
        property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml").get().asFile.absolutePath
    }
}